name: zstd-bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bench:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Run benchmark (16MB, 7 iterations)
        run: cargo run --release -- 16777216 7

      - name: Run benchmark (64MB, 5 iterations)
        run: cargo run --release -- 67108864 5

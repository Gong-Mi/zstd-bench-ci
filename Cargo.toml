[package]
name = "zstd-bench-ci"
version = "0.1.0"
edition = "2021"

[dependencies]
ruzstd = { git = "https://github.com/Gong-Mi/zstd-rs.git", branch = "perf-early-raw-escape" }
zstd = "0.13"
rand = { version = "0.8", features = ["small_rng"] }

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "zstd-bench-ci"
path = "src/main.rs"

[[bin]]
name = "correctness"
path = "src/correctness.rs"
